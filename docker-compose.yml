# InvenTree inventory management, reachable over Tailscale and on this PC's 127.0.0.1:8441. Every
# image is pinned; start it through docker-compose.ps1, which passes --env-file config.env and fills
# in the tailnet URL once the node has joined.
name: inventree-compose

x-inventree: &inventree
  image: inventree/inventree:1.5.6
  restart: unless-stopped
  environment:
    INVENTREE_SITE_URL: https://${INVENTREE_HOST:-inventree.invalid}
    # The site URL is added to both lists; these are the local address on this PC.
    INVENTREE_ALLOWED_HOSTS: localhost,127.0.0.1
    INVENTREE_TRUSTED_ORIGINS: http://localhost:8441,http://127.0.0.1:8441
    INVENTREE_DB_ENGINE: postgresql
    INVENTREE_DB_NAME: inventree
    INVENTREE_DB_HOST: db
    INVENTREE_DB_PORT: 5432
    INVENTREE_DB_USER: inventree
    INVENTREE_DB_PASSWORD: ${POSTGRES_PASSWORD}
    INVENTREE_ADMIN_USER: ${INVENTREE_ADMIN_USER}
    INVENTREE_ADMIN_PASSWORD: ${INVENTREE_ADMIN_PASSWORD}
    INVENTREE_ADMIN_EMAIL: ${INVENTREE_ADMIN_EMAIL}
    INVENTREE_USE_X_FORWARDED_HOST: "True"
    INVENTREE_USE_X_FORWARDED_PORT: "True"
    INVENTREE_USE_X_FORWARDED_PROTO: "True"
    # Applies database migrations and collects static files whenever the image version changes.
    INVENTREE_AUTO_UPDATE: "True"
    INVENTREE_CACHE_ENABLED: "False"
    INVENTREE_LOG_LEVEL: WARNING
    INVENTREE_TIMEZONE: ${TIMEZONE:-Europe/Berlin}
    INVENTREE_PLUGINS_ENABLED: "True"
    INVENTREE_PLUGIN_DIR: /home/inventree/plugins
    INVENTREE_CONFIG_FILE: /home/inventree/secrets/config.yaml
    INVENTREE_SECRET_KEY_FILE: /home/inventree/secrets/secret_key.txt
    INVENTREE_OIDC_PRIVATE_KEY_FILE: /home/inventree/secrets/oidc.pem
    INVENTREE_MEDIA_ROOT: /home/inventree/media
  volumes:
    - inventree-files:/home/inventree/data
    - ./plugins:/home/inventree/plugins:ro
    - ./data/secrets:/home/inventree/secrets
    - ./data/media:/home/inventree/media

services:
  # Answers 502 until the server is up, and starts without it so `up` can join the tailnet before
  # the server needs the ts.net name.
  gateway:
    extends: { file: gateway/gateway.yml, service: gateway }
    container_name: inventree-gateway
    ports:
      - "127.0.0.1:8441:8441"
    environment:
      TAILNET_HOST: ${INVENTREE_HOST:-inventree.invalid}
    volumes:
      - inventree-files:/srv/inventree:ro
      - ./data/media:/srv/media:ro

  tailscale:
    extends: { file: gateway/gateway.yml, service: tailscale }
    container_name: inventree-tailscale
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-inventree}

  server:
    <<: *inventree
    container_name: inventree-server
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "invoke server-health --address http://localhost:8000"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s

  worker:
    <<: *inventree
    container_name: inventree-worker
    command: invoke worker
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:17.10-alpine
    container_name: inventree-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inventree
    # A named volume: Postgres on a Windows bind mount fails on file permissions.
    volumes:
      - inventree-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventree -d inventree"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-backup:
    image: postgres:17.10-alpine
    container_name: inventree-db-backup
    restart: unless-stopped
    # The postgres image's own healthcheck probes a server this container never runs.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        log() { echo "$$(date '+%Y-%m-%d %H:%M:%S') $$1" >> /backups/backup.log; }
        while true; do
          # One interval first, so no pass dumps a database that `up` is still restoring or the server is migrating.
          sleep 3600
          # A dump killed mid-write (container stop) leaves its .tmp behind, and nothing else removes it.
          rm -f /backups/inventree-*.dump.tmp
          ts=$$(date +%Y%m%d-%H%M%S)
          tables=$$(psql -h db -U inventree -d inventree -Atc "select count(*) from information_schema.tables where table_schema = 'public'" 2>/dev/null)
          if [ "$$tables" = "0" ]; then
            log "skipped: database has no tables"
          elif pg_dump -h db -U inventree -d inventree -Fc -f /backups/inventree-$$ts.dump.tmp 2> /backups/last-error.log; then
            mv /backups/inventree-$$ts.dump.tmp /backups/inventree-$$ts.dump
            log "created inventree-$$ts.dump"
          else
            rm -f /backups/inventree-$$ts.dump.tmp
            log "FAILED inventree-$$ts.dump"
          fi
          ls -1t /backups/inventree-*.dump 2>/dev/null | tail -n +$$(( ${BACKUP_KEEP:-48} + 1 )) | while read -r old; do rm -f "$$old"; log "deleted $$(basename "$$old")"; done
        done

x-volume-roles:
  inventree-db: dumped
  inventree-files: rebuilt
  gateway-caddy-data: rebuilt
  tailscale-socket: rebuilt

volumes:
  inventree-db:
  inventree-files:
  gateway-caddy-data:
  tailscale-socket:
